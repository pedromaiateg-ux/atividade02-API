
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Pokédex</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <img id="imagem" src="" alt="Imagem do Pokémon">

        <h2 id="nome">Carregando...</h2>

        <span class="identificacao">ID: <span id="id">---</span></span>

        <div class="informacoes">

            <div class="info">
                <p>Altura</p>
                <strong id="altura">---</strong>
                <small>decímetros</small>
            </div>

            <div class="info">
                <p>Peso</p>
                <strong id="peso">---</strong>
                <small>hectogramas</small>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
